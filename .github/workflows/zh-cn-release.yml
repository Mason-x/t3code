name: Sync Upstream & Build zh-CN Release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag (leave empty for latest stable release)"
        required: false
        default: ""
      include_nightly:
        description: "Allow latest prerelease/nightly if tag is empty"
        type: boolean
        required: false
        default: false
      force:
        description: "Force rebuild & overwrite existing release on this fork"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Sync main with pingdotgg/t3code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream/main if safe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git || true
          git fetch upstream main

          AHEAD=$(git rev-list --count HEAD..upstream/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          if git diff --name-only HEAD..upstream/main | grep -q '^\.github/workflows/'; then
            echo "::notice::upstream/main touched .github/workflows/; skipping auto-push under GITHUB_TOKEN (run 'gh repo sync' manually when convenient)."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin main

  release-zh-cn:
    name: Repack & Publish zh-CN AppImage
    runs-on: ubuntu-latest
    needs: sync-upstream
    if: ${{ always() }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: pingdotgg/t3code
      FORK_REPO: ${{ github.repository }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install squashfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Resolve target release tag
        id: resolve
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ inputs.include_nightly }}" = "true" ]; then
              TAG="$(gh release list -R "$UPSTREAM_REPO" --limit 1 --json tagName --jq '.[0].tagName')"
            else
              TAG="$(gh release view -R "$UPSTREAM_REPO" --json tagName --jq '.tagName')"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG"

          if gh release view "$TAG" -R "$FORK_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already released
        if: ${{ steps.resolve.outputs.exists == 'true' && inputs.force != true }}
        run: |
          echo "Release ${{ steps.resolve.outputs.tag }} already exists on $FORK_REPO. Set force=true to rebuild."

      - name: Download, patch & repack AppImages
        if: ${{ steps.resolve.outputs.exists != 'true' || inputs.force == true }}
        id: build
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          OWNER="${FORK_REPO%%/*}"
          REPO="${FORK_REPO#*/}"

          mkdir -p upstream-assets dist-assets
          gh release view "$TAG" -R "$UPSTREAM_REPO" --json isPrerelease,publishedAt,name \
            > upstream-assets/meta.json

          IS_PRERELEASE="$(node -e 'const m=require("./upstream-assets/meta.json"); console.log(Boolean(m.isPrerelease));')"
          PUBLISHED_AT="$(node -e 'const m=require("./upstream-assets/meta.json"); console.log(m.publishedAt || new Date().toISOString());')"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          gh release download "$TAG" -R "$UPSTREAM_REPO" \
            --pattern "*.AppImage" \
            --pattern "latest-linux*.yml" \
            --pattern "nightly-linux*.yml" \
            --dir upstream-assets || true

          chmod +x i18n/zh-CN/repack-appimage.sh

          shopt -s nullglob
          APPIMAGES=(upstream-assets/*.AppImage)
          if [ "${#APPIMAGES[@]}" -eq 0 ]; then
            echo "No AppImage assets found in $UPSTREAM_REPO@$TAG" >&2
            exit 1
          fi

          for APP in "${APPIMAGES[@]}"; do
            BASE="$(basename "$APP")"
            YML_OUT=""
            if [[ "$BASE" == *"x86_64.AppImage" ]]; then
              if [ "$IS_PRERELEASE" = "true" ]; then
                YML_OUT="dist-assets/nightly-linux.yml"
              else
                YML_OUT="dist-assets/latest-linux.yml"
              fi
            elif [[ "$BASE" == *"arm64.AppImage" ]]; then
              if [ "$IS_PRERELEASE" = "true" ]; then
                YML_OUT="dist-assets/nightly-linux-arm64.yml"
              else
                YML_OUT="dist-assets/latest-linux-arm64.yml"
              fi
            fi

            ARGS=(
              --input "$APP"
              --output "dist-assets/$BASE"
              --owner "$OWNER"
              --repo "$REPO"
              --release-date "$PUBLISHED_AT"
            )
            if [ -n "$YML_OUT" ]; then
              ARGS+=(--yml-out "$YML_OUT" --asset-url "$BASE")
            fi

            ./i18n/zh-CN/repack-appimage.sh "${ARGS[@]}"
          done

          (cd dist-assets && sha256sum *.AppImage > SHA256SUMS)
          ls -lh dist-assets

      - name: Publish GitHub Release on fork
        if: ${{ steps.resolve.outputs.exists != 'true' || inputs.force == true }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.build.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="基于上游 [\`$UPSTREAM_REPO@$TAG\`](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG) 自动制作：
          - 已注入简体中文界面补丁（常用开发术语保留英文：Worktree / Thread / Provider / MCP / Skill / Git / Diff 等）
          - 已将桌面端 \`app-update.yml\` 自动更新源指向 \`$FORK_REPO\`"

          if gh release view "$TAG" -R "$FORK_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$FORK_REPO" --clobber dist-assets/*
            gh release edit "$TAG" -R "$FORK_REPO" --notes "$NOTES"
          else
            gh release create "$TAG" -R "$FORK_REPO" \
              $PRERELEASE_FLAG \
              --title "T3 Code $TAG (简体中文)" \
              --notes "$NOTES" \
              dist-assets/*
          fi
