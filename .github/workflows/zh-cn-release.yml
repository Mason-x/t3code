name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Sync main with pingdotgg/t3code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream/main if safe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git || true
          git fetch upstream main

          AHEAD=$(git rev-list --count HEAD..upstream/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          if git diff --name-only HEAD..upstream/main | grep -q '^\.github/workflows/'; then
            echo "::notice::upstream/main touched .github/workflows/; skipping auto-push under GITHUB_TOKEN (run 'gh repo sync' manually when convenient)."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin main
